<!DOCTYPE html>
<html>
<head><title>GLB Render Test</title>
<style>body{margin:0;background:#222}canvas{display:block}</style>
</head>
<body>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x333333);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(2.4, -2.0, 1.5);
camera.lookAt(0, 0, 0.3);
const renderer = new THREE.WebGLRenderer({ preserveDrawingBuffer: true });
renderer.setSize(640, 640);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x888888, 1.2));
const dl = new THREE.DirectionalLight(0xffffff, 1.5);
dl.position.set(2, -2, 3);
scene.add(dl);
const loader = new GLTFLoader();
loader.load('/models/bath-fs-plinth.glb', (gltf) => {
  scene.add(gltf.scene);
  // report mesh stats to window for the test to read
  let faces = 0, meshes = 0, flipped = 0;
  gltf.scene.traverse(o => {
    if (o.isMesh) {
      meshes++;
      faces += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
    }
  });
  window.__loadStats = { ok: true, meshes, faces, sceneChildren: scene.children.length };
  renderer.render(scene, camera);
  window.__rendered = true;
}, undefined, (err) => {
  window.__loadStats = { ok: false, error: String(err) };
});
window.__renderCheck = () => {
  renderer.render(scene, camera);
  const px = new Uint8Array(4);
  const gl = renderer.getContext();
  gl.readPixels(320, 320, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return { centre: Array.from(px), stats: window.__loadStats, rendered: !!window.__rendered };
};
</script>
</body>
</html>
